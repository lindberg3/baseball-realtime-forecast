<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="620" viewBox="0 0 1000 620" font-family="'Yu Gothic UI','Hiragino Sans','Noto Sans JP',sans-serif">
  <defs>
    <marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
  </defs>
  <rect width="1000" height="620" fill="#ffffff"/>

  <!-- ===== 入力ボックス (5列: cx = 108, 304, 500, 696, 892) ===== -->
  <g font-size="13" fill="#1e293b">
    <rect x="20" y="18" width="176" height="56" rx="7" fill="#f1f5f9" stroke="#64748b" stroke-width="1.4"/>
    <text x="108" y="41" text-anchor="middle" font-weight="bold">次の1球</text>
    <text x="108" y="60" text-anchor="middle" font-size="11.5" fill="#475569">球種・球速・コース</text>

    <rect x="216" y="18" width="176" height="56" rx="7" fill="#f1f5f9" stroke="#64748b" stroke-width="1.4"/>
    <text x="304" y="41" text-anchor="middle" font-weight="bold">試合状況</text>
    <text x="304" y="60" text-anchor="middle" font-size="11.5" fill="#475569">カウント・走者・点差</text>

    <rect x="412" y="18" width="176" height="56" rx="7" fill="#f1f5f9" stroke="#64748b" stroke-width="1.4"/>
    <text x="500" y="41" text-anchor="middle" font-weight="bold">打席内の投球履歴</text>
    <text x="500" y="60" text-anchor="middle" font-size="11.5" fill="#475569">1〜N球目の球種・球速</text>

    <rect x="608" y="18" width="176" height="56" rx="7" fill="#f1f5f9" stroke="#64748b" stroke-width="1.4"/>
    <text x="696" y="41" text-anchor="middle" font-weight="bold">打者の50打席履歴</text>
    <text x="696" y="60" text-anchor="middle" font-size="11.5" fill="#475569">投球データ・打撃結果</text>

    <rect x="804" y="18" width="176" height="56" rx="7" fill="#f1f5f9" stroke="#64748b" stroke-width="1.4"/>
    <text x="892" y="41" text-anchor="middle" font-weight="bold">投手の50打席履歴</text>
    <text x="892" y="60" text-anchor="middle" font-size="11.5" fill="#475569">傾向・配球</text>
  </g>

  <!-- 入力 → Embedding -->
  <g stroke="#475569" stroke-width="1.4">
    <line x1="108" y1="74" x2="108" y2="106" marker-end="url(#arw)"/>
    <line x1="304" y1="74" x2="304" y2="106" marker-end="url(#arw)"/>
    <line x1="500" y1="74" x2="500" y2="106" marker-end="url(#arw)"/>
    <line x1="696" y1="74" x2="696" y2="106" marker-end="url(#arw)"/>
    <line x1="892" y1="74" x2="892" y2="106" marker-end="url(#arw)"/>
  </g>

  <!-- ===== Embedding 行 ===== -->
  <g font-size="13" fill="#1e3a8a">
    <rect x="38" y="108" width="140" height="34" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.3"/>
    <text x="108" y="130" text-anchor="middle">Embedding</text>
    <rect x="234" y="108" width="140" height="34" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.3"/>
    <text x="304" y="130" text-anchor="middle">Embedding</text>
    <rect x="430" y="108" width="140" height="34" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.3"/>
    <text x="500" y="130" text-anchor="middle">Embedding</text>
    <rect x="626" y="108" width="140" height="34" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.3"/>
    <text x="696" y="130" text-anchor="middle">Embedding</text>
    <rect x="822" y="108" width="140" height="34" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.3"/>
    <text x="892" y="130" text-anchor="middle">Embedding</text>
  </g>

  <!-- Embedding → エンコーダ / バックボーン -->
  <g stroke="#475569" stroke-width="1.4">
    <line x1="108" y1="142" x2="108" y2="316" marker-end="url(#arw)"/>
    <line x1="304" y1="142" x2="304" y2="316" marker-end="url(#arw)"/>
    <line x1="500" y1="142" x2="500" y2="168" marker-end="url(#arw)"/>
    <line x1="696" y1="142" x2="696" y2="168" marker-end="url(#arw)"/>
    <line x1="892" y1="142" x2="892" y2="168" marker-end="url(#arw)"/>
  </g>

  <!-- ===== エンコーダ行 ===== -->
  <g font-size="12.5" fill="#14532d">
    <rect x="418" y="170" width="164" height="42" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.3"/>
    <text x="500" y="188" text-anchor="middle">Encoder</text>
    <text x="500" y="204" text-anchor="middle" font-size="11">GRU / Transformer+PE</text>

    <rect x="614" y="170" width="164" height="42" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.3"/>
    <text x="696" y="188" text-anchor="middle">Inner Encoder</text>
    <text x="696" y="204" text-anchor="middle" font-size="11">打席内の球を集約</text>

    <rect x="810" y="170" width="164" height="42" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.3"/>
    <text x="892" y="188" text-anchor="middle">Encoder</text>
    <text x="892" y="204" text-anchor="middle" font-size="11">GRU / Transformer+PE</text>
  </g>

  <!-- 打者履歴: Inner → Outer -->
  <line x1="696" y1="212" x2="696" y2="238" stroke="#475569" stroke-width="1.4" marker-end="url(#arw)"/>
  <g font-size="12.5" fill="#14532d">
    <rect x="614" y="240" width="164" height="42" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.3"/>
    <text x="696" y="258" text-anchor="middle">Outer Encoder</text>
    <text x="696" y="274" text-anchor="middle" font-size="11">50打席の系列を集約</text>
  </g>

  <!-- エンコーダ → バックボーン -->
  <g stroke="#475569" stroke-width="1.4">
    <line x1="500" y1="212" x2="500" y2="316" marker-end="url(#arw)"/>
    <line x1="696" y1="282" x2="696" y2="316" marker-end="url(#arw)"/>
    <line x1="892" y1="212" x2="892" y2="316" marker-end="url(#arw)"/>
  </g>

  <!-- ===== Backbone ===== -->
  <rect x="60" y="318" width="880" height="58" rx="9" fill="#1e3a5f"/>
  <text x="500" y="343" text-anchor="middle" font-size="16" font-weight="bold" fill="#ffffff">ResDNN Backbone（残差接続付き全結合）</text>
  <text x="500" y="364" text-anchor="middle" font-size="12.5" fill="#bfdbfe">[512, 512, 256, 256, 128]　※すべての特徴を連結して入力</text>

  <!-- Backbone → Heads -->
  <g stroke="#475569" stroke-width="1.4">
    <line x1="130" y1="376" x2="130" y2="406" marker-end="url(#arw)"/>
    <line x1="370" y1="376" x2="370" y2="406" marker-end="url(#arw)"/>
    <line x1="610" y1="376" x2="610" y2="406" marker-end="url(#arw)"/>
    <line x1="850" y1="376" x2="850" y2="406" marker-end="url(#arw)"/>
  </g>

  <!-- ===== Heads ===== -->
  <g font-size="13.5" fill="#7c2d12" font-weight="bold">
    <rect x="30" y="408" width="200" height="40" rx="6" fill="#ffedd5" stroke="#ea580c" stroke-width="1.3"/>
    <text x="130" y="433" text-anchor="middle">Head: スイング有無</text>
    <rect x="270" y="408" width="200" height="40" rx="6" fill="#ffedd5" stroke="#ea580c" stroke-width="1.3"/>
    <text x="370" y="433" text-anchor="middle">Head: スイング結果</text>
    <rect x="510" y="408" width="200" height="40" rx="6" fill="#ffedd5" stroke="#ea580c" stroke-width="1.3"/>
    <text x="610" y="433" text-anchor="middle">Head: 打球種類</text>
    <rect x="750" y="408" width="200" height="40" rx="6" fill="#ffedd5" stroke="#ea580c" stroke-width="1.3"/>
    <text x="850" y="433" text-anchor="middle">Head: 回帰（MDN）</text>
  </g>

  <!-- Heads → 出力 -->
  <g stroke="#475569" stroke-width="1.4">
    <line x1="130" y1="448" x2="130" y2="476" marker-end="url(#arw)"/>
    <line x1="370" y1="448" x2="370" y2="476" marker-end="url(#arw)"/>
    <line x1="610" y1="448" x2="610" y2="476" marker-end="url(#arw)"/>
    <line x1="850" y1="448" x2="850" y2="476" marker-end="url(#arw)"/>
  </g>

  <!-- ===== 出力 ===== -->
  <g font-size="12.5" fill="#334155">
    <rect x="30" y="478" width="200" height="52" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2"/>
    <text x="130" y="499" text-anchor="middle">スイングする / しない</text>
    <text x="130" y="517" text-anchor="middle" font-size="11.5" fill="#64748b">2値分類</text>
    <rect x="270" y="478" width="200" height="52" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2"/>
    <text x="370" y="499" text-anchor="middle">空振り・ファール・インプレー</text>
    <text x="370" y="517" text-anchor="middle" font-size="11.5" fill="#64748b">3クラス分類</text>
    <rect x="510" y="478" width="200" height="52" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2"/>
    <text x="610" y="499" text-anchor="middle">ゴロ・ライナー・フライ・ポップフライ</text>
    <text x="610" y="517" text-anchor="middle" font-size="11.5" fill="#64748b">4クラス分類（cascade で上位予測を利用）</text>
    <rect x="750" y="478" width="200" height="52" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2"/>
    <text x="850" y="499" text-anchor="middle">打球速度・角度・飛距離・方向</text>
    <text x="850" y="517" text-anchor="middle" font-size="11.5" fill="#64748b">混合ガウス分布（確率分布として出力）</text>
  </g>

  <!-- 脚注 -->
  <text x="500" y="562" text-anchor="middle" font-size="12.5" fill="#64748b">損失は階層マスク付きマルチタスク: スイングしなかった球の下位タスクは損失から除外。PE = Positional Encoding</text>
  <text x="500" y="584" text-anchor="middle" font-size="12.5" fill="#0369a1">投球予測AI（model_scope=pitch）は同じ基盤を再利用し、ヘッドを「球種（10クラス）＋コース heatmap」に切替</text>
</svg>
